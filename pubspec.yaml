name: cutting_log
description: A local-first, account-free plant cutting observation journal.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.13.2 <3.14.0'
  flutter: '>=3.47.2 <3.48.0'

dependencies:
  drift: ^2.34.3
  flutter:
    sdk: flutter
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  path: ^1.9.1
  path_provider: ^2.1.5
dev_dependencies:
  build_runner: ^2.16.0
  drift_dev: ^2.34.5
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  sqlite3: ^3.5.2

flutter:
  uses-material-design: true
