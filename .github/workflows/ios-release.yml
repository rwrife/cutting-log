name: iOS Release

on:
  workflow_dispatch:
    inputs:
      lane:
        description: Fastlane lane to run
        type: choice
        default: beta
        options:
          - beta
          - release
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Never cancel an in-flight run: it may already be uploading a binary to
# App Store Connect.
concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.2

jobs:
  publish:
    name: Build and publish to App Store Connect
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # Tag pushes carry no inputs, so they fall through to the beta lane.
      LANE: ${{ inputs.lane || 'beta' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Toolchain versions
        run: |
          echo "lane: $LANE"
          flutter --version
          dart --version
          xcodebuild -version
          fastlane --version
      - name: Run fastlane
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_HIDE_CHANGELOG: '1'
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: fastlane ios "$LANE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cutting-log-ios-${{ github.run_id }}
          path: |
            build/ios/ipa/*.ipa
            fastlane/report.xml
          if-no-files-found: warn
          retention-days: 14
