name: iOS CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Select Xcode
        run: sudo xcode-select --switch "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)/Contents/Developer"
      - name: Build and test
        run: ./tool/check.sh
      - name: Build simulator app
        run: ./tool/build_ios.sh
      - name: Archive simulator app
        run: ditto -c -k --sequesterRsrc --keepParent build/DerivedData/Build/Products/Debug-iphonesimulator/Cutting\\ Log.app build/CuttingLog.app.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cutting-log-ios-simulator
          path: build/CuttingLog.app.zip
          if-no-files-found: error
          retention-days: 7
