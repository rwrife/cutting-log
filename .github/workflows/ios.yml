name: iOS CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Select Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)"
          [ -n "$xcode" ] || xcode=/Applications/Xcode.app
          sudo xcode-select --switch "$xcode/Contents/Developer"
          major="$(xcodebuild -version | head -1 | cut -d' ' -f2 | cut -d. -f1)"
          if [ "$major" -lt 16 ]; then
            echo "::error::Cutting Log requires Xcode 16 or newer."
            exit 1
          fi
      - name: Build and test
        run: ./tool/check.sh
      - name: Build simulator app
        run: ./tool/build_ios.sh
      - name: Archive simulator app
        run: ditto -c -k --sequesterRsrc --keepParent "build/DerivedData/Build/Products/Debug-iphonesimulator/Cutting Log.app" build/CuttingLog.app.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cutting-log-ios-simulator
          path: build/CuttingLog.app.zip
          if-no-files-found: error
          retention-days: 7
