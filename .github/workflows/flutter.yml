name: Flutter CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.2

jobs:
  quality:
    name: Format, analyze, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Toolchain versions
        run: |
          flutter --version
          dart --version
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test --reporter expanded

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Toolchain versions
        run: |
          flutter --version
          dart --version
          java -version
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --debug
      - name: Release build (debug-signing fallback without key.properties)
        run: flutter build appbundle --release
      - run: flutter build apk --release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cutting-log-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cutting-log-android-release
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS simulator build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Toolchain versions
        run: |
          flutter --version
          dart --version
          xcodebuild -version
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --simulator --debug --no-codesign
      - name: Archive simulator app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app build/ios/iphonesimulator/CuttingLog.app.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cutting-log-ios-simulator
          path: build/ios/iphonesimulator/CuttingLog.app.zip
          if-no-files-found: error
          retention-days: 7

  android-e2e:
    name: Android emulator journey (API 34 x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Toolchain versions
        run: |
          flutter --version
          java -version
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --debug
      - name: Enable KVM group perms
        # Every prior run of this job logged "ProbeKVM: This user doesn't
        # have permissions to use KVM" and fell back to pure software
        # emulation: boots took 9-14 min, a 12MB APK install took 9 min,
        # and the Gradle/UTP installer gave up at its fixed 360s timeout
        # (run 34561201871: "adb command [install-multiple ...] failed due
        # to timeout. Timed out waiting for 360000 ms", 0 tests executed).
        # GitHub-hosted ubuntu runners ship /dev/kvm but the runner user is
        # not in the kvm group; the documented fix is a world-readable udev
        # rule (github.blog changelog 2024-04-02, hardware-accelerated
        # Android virtualization). With KVM the boot is ~10s and installs
        # finish in seconds.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Run full journal journey on API 34 emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          # Hosted runners here run without KVM (ProbeKVM: no permission in
          # every run log); boots take 9-14 min, and two attempts died at the
          # action's 600s default boot timeout. Give booting room inside the
          # 50-minute job budget.
          emulator-boot-timeout: 1500
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set +e
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" >/dev/null 2>&1 || true
            mkdir -p e2e-evidence
            # Clear stale/leftover package state first: run 34551678478 died
            # with UTP "Failed to install APK" + DELETE_FAILED_INTERNAL_ERROR
            # while trying to uninstall a half-state install before the
            # journey ever started (0 tests executed).
            adb uninstall com.rwrife.cutting_log.test || true
            adb uninstall com.rwrife.cutting_log || true
            adb install -r build/app/outputs/flutter-apk/app-debug.apk || adb install -r build/app/outputs/flutter-apk/app-debug.apk
            adb shell pm grant com.rwrife.cutting_log android.permission.POST_NOTIFICATIONS || true
            adb shell pm grant com.rwrife.cutting_log android.permission.CAMERA || true
            adb shell dumpsys package com.rwrife.cutting_log | grep -A8 "requested permissions" > e2e-evidence/requested-permissions.txt || true
            (cd android && ./gradlew app:connectedDebugAndroidTest -Ptarget="$(pwd)/../integration_test/offline_journal_e2e_test.dart")
            JOURNEY_STATUS=$?
            adb exec-out "run-as com.rwrife.cutting_log tar c app_flutter" | tar x -C e2e-evidence || true
            adb exec-out "run-as com.rwrife.cutting_log tar c files" | tar x -C e2e-evidence || true
            adb exec-out screencap -p > e2e-evidence/final-screen.png || true
            adb shell getprop ro.build.version.release > e2e-evidence/android-version.txt || true
            exit $JOURNEY_STATUS
      - name: Archive journey evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cutting-log-android-e2e-evidence
          path: |
            e2e-evidence
            android/app/build/outputs/androidTest-results
          if-no-files-found: warn
          retention-days: 30

  ios-e2e:
    name: iOS simulator journey (named iPhone)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Select and boot an available iPhone simulator
        id: simulator
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun simctl list devices available --json > /tmp/sims.json
          python3 - /tmp/sims.json /tmp/sim.env <<'PY'
          import json, shlex, sys
          data = json.load(open(sys.argv[1]))
          for runtime, devices in data['devices'].items():
              for d in devices:
                  if d.get('isAvailable') and d['name'].startswith('iPhone'):
                      with open(sys.argv[2], 'w') as env:
                          env.write("SIM_UDID=%s\n" % shlex.quote(d['udid']))
                          env.write("SIM_NAME=%s\n" % shlex.quote(d['name']))
                          env.write("SIM_RUNTIME=%s\n" % shlex.quote(runtime.split('.')[-1]))
                      sys.exit(0)
          sys.exit('no available iPhone simulator on this host')
          PY
          # shellcheck disable=SC1091
          . /tmp/sim.env
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b
          {
            echo "udid=$SIM_UDID"
            echo "name=$SIM_NAME"
            echo "runtime=$SIM_RUNTIME"
          } >> "$GITHUB_OUTPUT"
          xcodebuild -version
      - run: flutter pub get --enforce-lockfile
      - name: Run full journal journey on simulator
        # Hard 13-minute bound (outer) around the test's own 15-minute
        # timeout, and tee the console into the evidence directory: on run
        # 34433323596 the step produced zero output for 40 minutes after the
        # Xcode build finished (blank screen at cancel), so a captured
        # console tells us exactly where any future stall happened.
        run: |
          mkdir -p e2e-evidence
          set -o pipefail
          # macOS ships no GNU `timeout`; prefer gtimeout from coreutils.
          TIMEOUT_BIN="$(command -v timeout || command -v gtimeout || true)"
          # --disable-service-auth-codes: three consecutive runs stalled
          # permanently between 'Xcode build done' and the first test line.
          # That is the known flutter-test VM-service attach hang against
          # simulator discovery (auth-code exchange), not app code — the
          # journey-console.log ends exactly at the build line every time.
          if [ -n "$TIMEOUT_BIN" ]; then
            "$TIMEOUT_BIN" --preserve-status -k 30s 13m \
              flutter test integration_test/offline_journal_e2e_test.dart --disable-service-auth-codes -d "${{ steps.simulator.outputs.udid }}" \
              2>&1 | tee e2e-evidence/journey-console.log
          else
            flutter test integration_test/offline_journal_e2e_test.dart --disable-service-auth-codes -d "${{ steps.simulator.outputs.udid }}" \
              2>&1 | tee e2e-evidence/journey-console.log
          fi
      - name: Pull on-device journey evidence
        if: always()
        run: |
          mkdir -p e2e-evidence
          DATA=$(xcrun simctl get_app_container "${{ steps.simulator.outputs.udid }}" com.rwrife.cuttingLog data 2>/dev/null || true)
          if [ -n "$DATA" ]; then
            cp -R "$DATA"/Documents/e2e-evidence-* e2e-evidence/ 2>/dev/null || true
          fi
          xcrun simctl io "${{ steps.simulator.outputs.udid }}" screenshot e2e-evidence/final-screen.png || true
          {
            echo "simulator: ${{ steps.simulator.outputs.name }}"
            echo "runtime: ${{ steps.simulator.outputs.runtime }}"
            xcodebuild -version | head -1
          } > e2e-evidence/simulator.txt
      - name: Archive journey evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cutting-log-ios-e2e-evidence
          path: e2e-evidence
          if-no-files-found: warn
          retention-days: 30
